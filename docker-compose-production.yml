services:
  redis:
    image: redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - 127.0.0.1:6379:6379

  chatbot:
    build: .
    image: utarn/chatbot
    restart: always
    ports:
      - "8003:80"
    depends_on:
      - database
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:80"

  database:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      - POSTGRES_PASSWORD=password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgvector17_data:/var/lib/postgresql/data
  seq:
    image: datalust/seq
    restart: always
    ports:
      - 127.0.0.1:5431:80
    volumes:
      - seq_data:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=admin

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  redis_data:
  seq_data:
  pgvector17_data:
  qdrant_storage:
